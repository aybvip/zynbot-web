<!DOCTYPE html>
<html dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>ZYN Bot</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;
  font-family:system-ui,-apple-system,'Segoe UI',sans-serif;
  text-align:center;padding:20px;
  background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);
  background-size:400% 400%;
  animation:bgMove 12s ease infinite;
  color:#fff;
  overflow:hidden
}
@keyframes bgMove{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}
body::before{
  content:'';position:fixed;top:-50%;left:-50%;width:200%;height:200%;
  background:radial-gradient(ellipse at 20% 50%,rgba(255,107,107,.08) 0%,transparent 50%),
             radial-gradient(ellipse at 80% 20%,rgba(78,205,196,.08) 0%,transparent 50%),
             radial-gradient(ellipse at 50% 80%,rgba(255,165,0,.06) 0%,transparent 50%);
  pointer-events:none;z-index:0
}
.card{
  position:relative;z-index:1;
  background:rgba(255,255,255,.04);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  border-radius:32px;
  padding:48px 40px 40px;
  border:1px solid rgba(255,255,255,.08);
  box-shadow:0 25px 60px rgba(0,0,0,.4);
  max-width:430px;width:100%;
  transition:transform .4s ease,opacity .4s ease
}
.logo{
  width:80px;height:80px;
  background:linear-gradient(135deg,#667eea,#764ba2);
  border-radius:24px;
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 20px;
  font-size:28px;font-weight:800;
  box-shadow:0 8px 32px rgba(102,126,234,.35);
  transform:scale(1);
  transition:transform .3s ease
}
.logo:hover{transform:scale(1.05) rotate(-3deg)}
h1{
  font-size:26px;font-weight:700;
  margin-bottom:4px;
  background:linear-gradient(135deg,#fff 30%,rgba(255,255,255,.6));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text
}
.subtitle{
  font-size:14px;color:rgba(255,255,255,.45);
  margin-bottom:28px;letter-spacing:.3px
}
.spinner-wrap{
  display:flex;flex-direction:column;align-items:center;gap:14px;
  margin-bottom:6px
}
.spinner{
  width:44px;height:44px;
  border:3px solid rgba(255,255,255,.08);
  border-top-color:#667eea;
  border-radius:50%;
  animation:spin .75s linear infinite
}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner-text{font-size:14px;color:rgba(255,255,255,.5)}
.illustration{
  display:none;margin:0 auto 10px;width:200px;height:auto
}
.illustration svg{width:100%;height:auto}
.status{
  display:none;
  padding:14px 20px;
  border-radius:16px;
  font-size:15px;
  line-height:1.6;
  margin-top:6px;
  opacity:0;
  transform:translateY(8px);
  transition:opacity .5s ease,transform .5s ease
}
.status.show{
  opacity:1;
  transform:translateY(0)
}
.online{
  background:rgba(0,200,83,.12);
  border:1px solid rgba(0,200,83,.2);
  color:#69f0ae
}
.offline{
  background:rgba(255,87,34,.1);
  border:1px solid rgba(255,87,34,.18);
  color:#ffab91
}
.status-title{font-weight:600;font-size:17px;margin-bottom:4px}
.status-desc{font-size:13px;opacity:.8}
.retry-btn{
  display:none;
  margin-top:16px;
  padding:10px 28px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.05);
  color:rgba(255,255,255,.7);
  font-size:14px;cursor:pointer;
  transition:all .25s ease;
  font-family:inherit
}
.retry-btn:hover{
  background:rgba(255,255,255,.1);
  border-color:rgba(255,255,255,.2);
  color:#fff
}
.footer{
  margin-top:28px;
  font-size:12px;
  color:rgba(255,255,255,.2);
  letter-spacing:.2px
}
@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-10px)}
}
.floating{
  animation:float 4s ease-in-out infinite;
  display:inline-block
}
</style>
</head>
<body>
<div class="card">
  <div class="logo" id="logo">Z</div>
  <h1>ZYN Bot</h1>
  <p class="subtitle">منصة الترفيه الرقمية</p>

  <!-- Loading state -->
  <div class="spinner-wrap" id="loadingWrap">
    <div class="spinner"></div>
    <div class="spinner-text">جاري فحص حالة البوت...</div>
  </div>

  <!-- Maintenance illustration (hidden initially) -->
  <div class="illustration" id="illustration">
    <svg viewBox="0 0 200 160" fill="none" xmlns="http://www.w3.org/2000/svg" class="floating">
      <rect x="60" y="85" width="80" height="55" rx="8" fill="rgba(255,255,255,.06)" stroke="rgba(255,255,255,.15)" stroke-width="1.5"/>
      <rect x="55" y="100" width="90" height="4" rx="2" fill="rgba(255,255,255,.06)"/>
      <circle cx="100" cy="140" r="10" fill="rgba(255,255,255,.06)" stroke="rgba(255,255,255,.15)" stroke-width="1.5"/>
      <path d="M88 97v8M100 93v8M112 97v8" stroke="rgba(255,255,255,.1)" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M72 115l8-6-8 4 4-3M128 115l-8-6 8 4-4-3" stroke="rgba(255,255,255,.08)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="100" cy="70" r="22" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.1)" stroke-width="1.5"/>
      <path d="M94 68l4 4 8-8" stroke="rgba(102,126,234,.4)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>

  <!-- Status message -->
  <div class="status" id="status">
    <div class="status-title" id="statusTitle"></div>
    <div class="status-desc" id="statusDesc"></div>
  </div>

  <button class="retry-btn" id="retryBtn" onclick="location.reload()">إعادة المحاولة</button>

  <div class="footer">© 2026 ZYN Bot — جميع الحقوق محفوظة</div>
</div>

<script>
const API_URL = 'https://travesti-helena-gains-protocols.trycloudflare.com/api';
const APP_URL = 'https://travesti-helena-gains-protocols.trycloudflare.com';
const els = {
  loading: document.getElementById('loadingWrap'),
  illustration: document.getElementById('illustration'),
  status: document.getElementById('status'),
  statusTitle: document.getElementById('statusTitle'),
  statusDesc: document.getElementById('statusDesc'),
  retry: document.getElementById('retryBtn'),
  msg: document.getElementById('msg')
};

function showStatus(type, title, desc) {
  els.loading.style.display = 'none';
  els.illustration.style.display = 'block';
  els.status.className = 'status show ' + type;
  els.statusTitle.textContent = title;
  els.statusDesc.textContent = desc;
  els.retry.style.display = 'inline-block';
}

(async()=>{
  try {
    const r = await fetch(API_URL + '/reels/feed?limit=1', { signal: AbortSignal.timeout(8000) });
    if (r.ok) {
      // Bot is alive — redirect
      window.location.href = APP_URL;
    } else {
      throw new Error('HTTP ' + r.status);
    }
  } catch(e) {
    showStatus(
      'offline',
      '🔧 البوت قيد التحديث',
      'نعمل حاليًا على تحسين الخدمة وإضافة ميزات جديدة.\nيرجى المحاولة بعد قليل.\nشكرًا لتفهمك!'
    );
  }
})();
</script>
</body>
</html>
