<!DOCTYPE html>
<html dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>ZYN Bot</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;
  background:#1a1a2e;
  font-family:'Courier New',Courier,monospace;
  text-align:center;padding:20px;
  color:#e0e0e0;
  position:relative;
  overflow:hidden
}

/* Subtle scanlines */
body::after{
  content:'';
  position:fixed;top:0;left:0;width:100%;height:100%;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.08) 2px,rgba(0,0,0,.08) 4px);
  pointer-events:none;z-index:10
}

.pixel-bg{
  position:fixed;top:0;left:0;width:100%;height:100%;
  background-image:
    radial-gradient(circle at 20% 30%, rgba(102,126,234,.06) 0%, transparent 40%),
    radial-gradient(circle at 80% 70%, rgba(118,75,162,.06) 0%, transparent 40%);
  pointer-events:none;z-index:0
}

.card{
  position:relative;z-index:1;
  background:#16213e;
  border:3px solid #0f3460;
  image-rendering:pixelated;
  padding:36px 32px 28px;
  max-width:400px;width:100%;
  box-shadow:8px 8px 0 #0a0a1a
}

/* Pixel art monitor */
.pixel-monitor{
  width:120px;height:100px;
  margin:0 auto 18px;
  position:relative;
  image-rendering:pixelated
}
.pixel-monitor .screen{
  width:96px;height:72px;
  background:#0a0a1a;
  border:3px solid #0f3460;
  position:absolute;top:0;left:12px;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden
}
.pixel-monitor .screen .pixel-wrench,
.pixel-monitor .screen .pixel-gear{
  position:absolute;font-size:28px;opacity:.3
}
.pixel-monitor .screen .pixel-wrench{
  top:18px;left:22px
}
.pixel-monitor .screen .pixel-gear{
  bottom:16px;right:20px
}
.pixel-monitor .screen .pixel-face{
  font-size:18px;opacity:.5;letter-spacing:2px
}
.pixel-monitor .stand{
  width:40px;height:16px;
  background:#0f3460;
  position:absolute;bottom:0;left:40px
}
.pixel-monitor .base{
  width:60px;height:6px;
  background:#0f3460;
  position:absolute;bottom:0;left:30px
}
.pixel-monitor .dot{
  width:6px;height:6px;
  background:#0f3460;
  position:absolute;bottom:6px;left:57px;
  box-shadow:
    4px 0 0 0 #0f3460,
    8px 0 0 0 #0f3460,
    0 4px 0 0 #0f3460,
    4px 4px 0 0 #0f3460,
    8px 4px 0 0 #0f3460
}

h1{
  font-size:22px;font-weight:400;
  letter-spacing:2px;
  text-transform:uppercase;
  margin-bottom:2px;
  color:#e0e0e0
}
.subtitle{
  font-size:11px;color:#6b7280;
  letter-spacing:1px;
  margin-bottom:24px
}

.divider{
  border:none;border-top:2px solid #0f3460;
  margin:0 0 20px
}

.loading{
  display:flex;flex-direction:column;align-items:center;gap:14px
}
.pixel-spinner{
  display:flex;gap:4px
}
.pixel-spinner span{
  display:block;
  width:8px;height:8px;
  background:#0f3460;
  animation:blink 1s step-end infinite
}
.pixel-spinner span:nth-child(2){animation-delay:.2s}
.pixel-spinner span:nth-child(3){animation-delay:.4s}
.pixel-spinner span:nth-child(4){animation-delay:.6s}
.pixel-spinner span:nth-child(5){animation-delay:.8s}
@keyframes blink{
  0%,100%{background:#0f3460}
  50%{background:#667eea}
}
.loading-text{
  font-size:12px;color:#6b7280;
  letter-spacing:.5px
}

.status{
  display:none;
  padding:16px;
  border:2px solid;
  margin-top:4px;
  font-size:13px;
  line-height:1.8
}
.status-title{
  font-size:14px;font-weight:700;
  letter-spacing:.5px;
  margin-bottom:4px
}
.online{
  border-color:#00c85333;
  background:#00c85308;
  color:#69f0ae
}
.offline{
  border-color:#ff572233;
  background:#ff572208;
  color:#ffab91
}

.retry-btn{
  display:none;
  margin-top:14px;
  padding:8px 24px;
  background:#0f3460;
  border:none;
  color:#e0e0e0;
  font-family:'Courier New',Courier,monospace;
  font-size:12px;
  cursor:pointer;
  letter-spacing:1px;
  image-rendering:pixelated;
  box-shadow:3px 3px 0 #0a0a1a;
  transition:all .1s ease
}
.retry-btn:hover{
  background:#1a4a80;
  box-shadow:1px 1px 0 #0a0a1a;
  transform:translate(2px,2px)
}

.footer{
  margin-top:24px;
  font-size:10px;
  color:#4b5563;
  letter-spacing:.5px
}
</style>
</head>
<body>
<div class="pixel-bg"></div>
<div class="card">
  <!-- Pixel art monitor -->
  <div class="pixel-monitor">
    <div class="screen">
      <span class="pixel-wrench">🔧</span>
      <span class="pixel-gear">⚙️</span>
      <span class="pixel-face">(•_•)</span>
    </div>
    <div class="stand"></div>
    <div class="base"></div>
    <div class="dot"></div>
  </div>

  <h1>ZYN Bot</h1>
  <p class="subtitle">// DIGITAL ENTERTAINMENT //</p>
  <hr class="divider">

  <!-- Loading -->
  <div class="loading" id="loadingWrap">
    <div class="pixel-spinner">
      <span></span><span></span><span></span><span></span><span></span>
    </div>
    <div class="loading-text">> SCANNING SYSTEM...</div>
  </div>

  <!-- Status -->
  <div class="status" id="status">
    <div class="status-title" id="statusTitle"></div>
    <div id="statusDesc"></div>
  </div>

  <button class="retry-btn" id="retryBtn" onclick="location.reload()">> RETRY</button>

  <div class="footer">(c) 2026 ZYN BOT // ALL RIGHTS RESERVED</div>
</div>

<script>
const API_URL = 'https://travesti-helena-gains-protocols.trycloudflare.com/api';
const APP_URL = 'https://travesti-helena-gains-protocols.trycloudflare.com';

function showStatus(type, title, desc) {
  document.getElementById('loadingWrap').style.display = 'none';
  var s = document.getElementById('status');
  s.className = 'status ' + type;
  document.getElementById('statusTitle').textContent = title;
  document.getElementById('statusDesc').textContent = desc;
  s.style.display = 'block';
  document.getElementById('retryBtn').style.display = 'inline-block';
}

(async()=>{
  try {
    var r = await fetch(API_URL + '/reels/feed?limit=1', { signal: AbortSignal.timeout(8000) });
    if (r.ok) {
      window.location.href = APP_URL;
    } else {
      throw new Error('HTTP ' + r.status);
    }
  } catch(e) {
    showStatus(
      'offline',
      '! SYSTEM OFFLINE',
      '> MAINTENANCE IN PROGRESS\n> PLEASE TRY AGAIN LATER\n> THANK YOU FOR YOUR PATIENCE'
    );
  }
})();
</script>
</body>
</html>
